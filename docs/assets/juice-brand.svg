<svg xmlns="http://www.w3.org/2000/svg" width="520" height="150" viewBox="0 0 520 150" role="img" aria-labelledby="title desc">
  <title id="title">Juice</title>
  <desc id="desc">The Juice capsule mark and wordmark.</desc>
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d79b35"/>
      <stop offset="1" stop-color="#667a62"/>
    </linearGradient>
    <style>
      .wordmark { fill: #1f2d3d; }
      @media (prefers-color-scheme: dark) {
        .wordmark { fill: #f2f5f1; }
      }
    </style>
  </defs>
  <rect x="30" y="28" width="34" height="94" rx="17" fill="url(#mark)"/>
  <text class="wordmark" x="92" y="105" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="82" font-weight="700" letter-spacing="0">Juice</text>
</svg>
