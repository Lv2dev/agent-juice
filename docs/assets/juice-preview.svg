      <circle cx="926" cy="88" r="8" fill="#4cc27a"/>
      <circle cx="950" cy="88" r="8" fill="#f06f6b"/>
    </g>
    <rect x="188" y="146" width="744" height="146" rx="12" fill="#ffffff" fill-opacity="0.58" stroke="#dde4db"/>
    <rect x="205" y="167" width="8" height="28" rx="4" fill="url(#mark)"/>
    <text x="226" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2d3d">Juice</text>
    <text x="874" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a8793">Local</text>
    <text x="205" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#4b5968">Codex</text>
