<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Juice desktop preview</title>
  <desc id="desc">A preview of the Juice settings panel and taskbar usage bar.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f7f3"/>
      <stop offset="0.52" stop-color="#edf1ec"/>
      <stop offset="1" stop-color="#f8f2e7"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d79b35"/>
      <stop offset="1" stop-color="#667a62"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#566152" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1120" height="620" rx="0" fill="url(#page)"/>
  <g filter="url(#softShadow)">
    <rect x="150" y="66" width="820" height="442" rx="18" fill="#f8faf7" fill-opacity="0.72" stroke="#d8ded5"/>
    <rect x="150" y="66" width="820" height="44" rx="18" fill="#ffffff" fill-opacity="0.48"/>
    <g id="window-controls">
