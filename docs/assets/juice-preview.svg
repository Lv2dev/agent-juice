    <rect x="205" y="248" width="200" height="10" rx="5" fill="#7bcf9a"/>
    <text x="205" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8b95a1">5h reset in 2h 18m</text>
    <rect x="188" y="316" width="744" height="156" rx="12" fill="#ffffff" fill-opacity="0.46" stroke="#dde4db"/>
    <text x="214" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">Settings</text>
    <rect x="214" y="374" width="322" height="48" rx="8" fill="#f5f7f4" stroke="#d8ded5"/>
    <text x="234" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#536170">Language</text>
    <rect x="388" y="382" width="128" height="32" rx="7" fill="#ffffff" fill-opacity="0.66" stroke="#ccd4cc"/>
    <text x="410" y="403" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">System</text>
    <rect x="566" y="374" width="322" height="48" rx="8" fill="#f5f7f4" stroke="#d8ded5"/>
    <text x="586" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#536170">Connect Claude</text>
    <rect x="785" y="383" width="64" height="30" rx="15" fill="#8ee5ae"/>
