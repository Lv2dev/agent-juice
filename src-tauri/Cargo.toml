[package]
name = "agent-juice"
version = "0.1.2"
description = "Juice local usage monitor"
authors = ["pointi"]
edition = "2021"
default-run = "agent-juice"

[lib]
name = "agent_juice"
crate-type = ["rlib"]

[[bin]]
name = "agentjuice-statusline"
path = "src/bin/statusline.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
resvg = "0.44"
once_cell = "1"
gethostname = "0.5"
dirs = "5"
anyhow = "1"
tokio = { version = "1", features = ["time"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-autostart = "2"
