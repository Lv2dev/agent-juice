[package]
name = "agent-juice"
version = "0.1.14"
description = "Juice local usage monitor"
authors = ["pointi"]
edition = "2021"
default-run = "agent-juice"

[lib]
name = "agent_juice"
crate-type = ["rlib"]

[[bin]]
name = "agentjuice-statusline"
path = "src/bin/statusline.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3.0.11"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
resvg = "0.44"
once_cell = "1"
gethostname = "0.5"
dirs = "5"
anyhow = "1"
tokio = { version = "1", features = ["macros", "sync", "time"] }
windows = { version = "0.61", features = ["Win32_Devices_Display", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2.10.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.2.5"
