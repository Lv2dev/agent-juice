<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Juice</title>
    <script type="module" src="/panel.js" defer></script>
    <script type="module" src="/settings.js" defer></script>
  </head>
  <body class="panel-window">
    <div class="panel-frame">
      <header class="panel-chrome" data-tauri-drag-region>
        <div class="chrome-spacer" data-tauri-drag-region></div>
        <div class="chrome-title" data-tauri-drag-region>Juice</div>
        <div class="window-controls" aria-label="창 제어" data-i18n-aria-label="aria.windowControls">
          <button
            class="chrome-dot chrome-minimize"
            type="button"
            title="최소화"
            aria-label="최소화"
            data-i18n-title="window.minimize"
            data-window-action="minimize"
          ></button>
          <button
            class="chrome-dot chrome-maximize"
            type="button"
            title="최대화"
            aria-label="최대화"
            data-i18n-title="window.maximize"
            data-window-action="toggle-maximize"
          ></button>
          <button
            class="chrome-dot chrome-close"
            type="button"
            title="닫기"
            aria-label="닫기"
            data-i18n-title="window.close"
            data-window-action="close"
          ></button>
        </div>
      </header>

      <main class="panel-shell">
      <header class="panel-head">
        <h1>Juice</h1>
        <span data-i18n="scope.local">로컬</span>
      </header>

      <section id="update-band" class="update-band" hidden aria-live="polite">
        <div class="update-band-copy">
          <strong data-i18n="update.available">새 버전을 사용할 수 있습니다</strong>
          <span data-update-version></span>
        </div>
        <button type="button" data-action="open-available-release" data-i18n="action.viewRelease">릴리즈 보기</button>
      </section>

      <section class="tool-card" data-tool="claude" data-state="empty">
        <header class="tool-head">
          <div class="tool-title">
            <span class="tool-dot claude-dot"></span>
            <h2>Claude</h2>
          </div>
          <span class="pc"></span>
        </header>

        <div class="metric p5h">
          <div class="metric-row">
            <span>5h</span>
            <strong class="val">–</strong>
          </div>
          <div class="track"><span class="fill"></span></div>
          <p class="reset"></p>
        </div>

        <div class="metric pweek">
          <div class="metric-row">
            <span data-i18n="limit.weekly">주간</span>
            <strong class="val">–</strong>
          </div>
          <div class="track"><span class="fill"></span></div>
          <p class="reset"></p>
        </div>

        <p class="empty-hint"></p>
        <p class="meta"></p>
      </section>

      <section class="tool-card" data-tool="codex" data-state="empty">
        <header class="tool-head">
          <div class="tool-title">
            <span class="tool-dot codex-dot"></span>
            <h2>Codex</h2>
          </div>
          <span class="pc"></span>
        </header>

        <div class="metric p5h">
          <div class="metric-row">
            <span>5h</span>
            <strong class="val">–</strong>
          </div>
          <div class="track"><span class="fill"></span></div>
          <p class="reset"></p>
        </div>

        <div class="metric pweek">
          <div class="metric-row">
            <span data-i18n="limit.weekly">주간</span>
            <strong class="val">–</strong>
          </div>
          <div class="track"><span class="fill"></span></div>
          <p class="reset"></p>
        </div>

        <p class="empty-hint"></p>
        <p class="meta"></p>
      </section>

      <form id="settings-form" class="settings-layout">
        <details class="settings-card" open>
          <summary>
            <span class="settings-title" data-i18n="settings.title">설정</span>
            <span class="settings-save-state" data-settings-save-state data-state="ready" hidden>
              <span class="settings-save-dot" aria-hidden="true"></span>
              <span id="settings-status" class="settings-status" aria-live="polite"></span>
            </span>
          </summary>
          <div class="settings-form">
          <fieldset class="settings-section" data-settings-section="appearance">
            <legend data-i18n="section.appearance">외형</legend>
            <div class="settings-section-grid">
              <div class="field-row">
                <label for="theme" data-i18n="field.theme">테마</label>
                <select id="theme" name="theme">
                  <option value="system" data-i18n="option.system">시스템</option>
                  <option value="light" data-i18n="option.light">라이트</option>
                  <option value="dark" data-i18n="option.dark">다크</option>
                </select>
              </div>

              <div class="field-row">
                <label for="language" data-i18n="field.language">언어</label>
                <select id="language" name="language">
                  <option value="system" data-i18n="option.system">시스템</option>
                  <option value="ko" data-i18n="option.languageKo">한국어</option>
                  <option value="en" data-i18n="option.languageEn">English</option>
                </select>
              </div>

              <div class="field-row">
                <label for="font-mode" data-i18n="field.font">폰트</label>
                <select id="font-mode" name="font_mode">
                  <option value="system">Windows</option>
                  <option value="pretendard">Pretendard</option>
                </select>
              </div>

              <div class="palette-field">
                <span id="palette-label" class="palette-label" data-i18n="field.palette">팔레트</span>
                <input id="palette" type="hidden" name="palette" value="traffic" />
                <div class="palette-picker" role="radiogroup" aria-labelledby="palette-label" data-palette-picker>
                  <button type="button" class="palette-option" role="radio" aria-checked="true" data-palette-value="traffic">
                    <span class="palette-sample" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                    <span data-i18n="option.tool">도구별</span>
                  </button>
                  <button type="button" class="palette-option" role="radio" aria-checked="false" data-palette-value="signal">
                    <span class="palette-sample" aria-hidden="true"><i></i><i></i><i></i></span>
                    <span data-i18n="option.signal">신호등</span>
                  </button>
                  <button type="button" class="palette-option" role="radio" aria-checked="false" data-palette-value="ocean">
                    <span class="palette-sample" aria-hidden="true"><i></i><i></i><i></i></span>
                    <span data-i18n="option.ocean">바다</span>
                  </button>
                  <button type="button" class="palette-option" role="radio" aria-checked="false" data-palette-value="forest">
                    <span class="palette-sample" aria-hidden="true"><i></i><i></i><i></i></span>
                    <span data-i18n="option.forest">숲</span>
                  </button>
                  <button type="button" class="palette-option" role="radio" aria-checked="false" data-palette-value="sunset">
                    <span class="palette-sample" aria-hidden="true"><i></i><i></i><i></i></span>
                    <span data-i18n="option.sunset">노을</span>
                  </button>
                  <button type="button" class="palette-option" role="radio" aria-checked="false" data-palette-value="cvd">
                    <span class="palette-sample" aria-hidden="true"><i></i><i></i><i></i></span>
                    <span data-i18n="option.cvd">색각 보정</span>
                  </button>
                  <button type="button" class="palette-option" role="radio" aria-checked="false" data-palette-value="cool">
                    <span class="palette-sample" aria-hidden="true"><i></i><i></i><i></i></span>
                    <span data-i18n="option.cool">오로라</span>
                  </button>
                  <button type="button" class="palette-option" role="radio" aria-checked="false" data-palette-value="mono">
                    <span class="palette-sample" aria-hidden="true"><i></i><i></i><i></i></span>
                    <span data-i18n="option.mono">단색</span>
                  </button>
                  <button type="button" class="palette-option" role="radio" aria-checked="false" data-palette-value="custom">
                    <span class="palette-sample" aria-hidden="true"><i></i><i></i><i></i></span>
                    <span data-i18n="option.custom">사용자 지정</span>
                  </button>
                </div>
              </div>

              <div class="tool-color-field" data-tool-palette>
                <span class="palette-label" data-i18n="field.toolColors">도구별 색상</span>
                <div class="swatch-row tool-swatch-row">
                  <label>
                    <span data-i18n="field.claudePrimaryColor">Claude 5h</span>
                    <input type="color" name="claude_primary_color" value="#d79a32" />
                  </label>
                  <label>
                    <span data-i18n="field.claudeSecondaryColor">Claude 주간</span>
                    <input type="color" name="claude_secondary_color" value="#d36b86" />
                  </label>
                  <label>
                    <span data-i18n="field.codexPrimaryColor">Codex 5h</span>
                    <input type="color" name="codex_primary_color" value="#2fac7d" />
                  </label>
                  <label>
                    <span data-i18n="field.codexSecondaryColor">Codex 주간</span>
                    <input type="color" name="codex_secondary_color" value="#4d86d6" />
                  </label>
                </div>
              </div>

              <div class="swatch-row" data-mono-palette hidden>
                <label>
                  <span data-i18n="field.monoColor">통일 색상</span>
                  <input type="color" name="mono_color" value="#4f8a73" />
                </label>
              </div>

              <div class="swatch-row" data-custom-palette hidden>
                <label>
                  <span data-i18n="field.safe">안전</span>
                  <input type="color" name="custom_safe" value="#22c55e" />
                </label>
                <label>
                  <span data-i18n="field.warning">경고</span>
                  <input type="color" name="custom_warn" value="#f59e0b" />
                </label>
                <label>
                  <span data-i18n="field.danger">위험</span>
                  <input type="color" name="custom_danger" value="#ef4444" />
                </label>
              </div>
            </div>
          </fieldset>

          <fieldset class="settings-section" data-settings-section="limits">
            <legend data-i18n="section.limits">표시·수집</legend>
            <div class="settings-section-grid">
              <div class="field-row">
                <label for="display-basis" data-i18n="field.displayBasis">표시 기준</label>
                <select id="display-basis" name="display_basis">
                  <option value="remaining" data-i18n="option.remaining">잔여량</option>
                  <option value="used" data-i18n="option.used">사용량</option>
                </select>
              </div>

              <label class="range-row">
                <span><span data-display-basis-copy="warning">잔여량 경고</span> <output name="warn-output">30</output>%</span>
                <input
                  type="range"
                  name="warn_threshold"
                  min="0"
                  max="100"
                  step="1"
                  value="30"
                />
              </label>

              <label class="range-row">
                <span><span data-display-basis-copy="danger">잔여량 위험</span> <output name="danger-output">10</output>%</span>
                <input
                  type="range"
                  name="danger_threshold"
                  min="0"
                  max="100"
                  step="1"
                  value="10"
                />
              </label>

              <small class="field-help threshold-help" data-display-basis-copy="help">표시값이 이 값 이하가 되면 경고/위험 색을 씁니다.</small>

              <div class="field-grid">
                <label class="field-with-help">
                  <span data-i18n="field.pollInterval">수집주기</span>
                  <input
                    type="number"
                    name="poll_interval_secs"
                    min="1"
                    max="60"
                    value="60"
                  />
                  <output name="poll-output">60</output>
                  <span data-i18n="unit.seconds">초</span>
                  <small class="field-help" data-i18n="help.pollInterval">로컬 상태를 다시 읽는 간격.</small>
                </label>
                <label class="field-with-help">
                  <span data-i18n="field.staleAfter">오래됨</span>
                  <input
                    type="number"
                    name="stale_after_secs"
                    min="1"
                    max="600"
                    value="90"
                  />
                  <output name="stale-output">90</output>
                  <span data-i18n="unit.seconds">초</span>
                  <small class="field-help" data-i18n="help.staleAfter">마지막 기록 후 오래됨 표시까지.</small>
                </label>
              </div>

              <label class="toggle-row toggle-row-wide collection-toggle">
                <input type="checkbox" name="claude_account_auto_collect_on" checked />
                <span class="toggle-copy">
                  <span class="toggle-title" data-i18n="field.claudeUsageAutoRefresh">Claude 계정 사용량 자동 수집</span>
                  <small class="field-help" data-i18n="help.claudeUsageAutoRefresh">Claude Code 로컬 로그인으로 계정 사용량을 조회합니다. 채팅을 보내지 않으며 실패 시 기존 statusline 값을 유지합니다.</small>
                </span>
              </label>
            </div>
          </fieldset>

          <fieldset class="settings-section" data-settings-section="taskbar">
            <legend data-i18n="section.taskbar">작업표시줄</legend>
            <div class="settings-section-grid">
              <div class="field-row">
                <label for="bar-mode" data-i18n="field.barMode">바 모드</label>
                <select id="bar-mode" name="bar_mode">
                  <option value="full" data-i18n="option.spacious">넉넉</option>
                  <option value="compact" data-i18n="option.compact">컴팩트</option>
                  <option value="dual" data-i18n="option.dual">이중원</option>
                  <option value="quad" data-i18n="option.quad">링4</option>
                </select>
              </div>

              <label class="toggle-row" data-full-reset-toggle>
                <input type="checkbox" name="full_reset_time_on" />
                <span data-i18n="field.fullResetTime">Full 리셋 시간</span>
              </label>

              <div class="field-row">
                <label for="limit-order" data-i18n="field.limitOrder">한도 순서</label>
                <select id="limit-order" name="limit_order">
                  <option value="primary_first" data-i18n="option.primaryFirst">5h 먼저</option>
                  <option value="secondary_first" data-i18n="option.secondaryFirst">주간 먼저</option>
                </select>
              </div>

              <div class="field-row">
                <label for="indicator-style" data-i18n="field.indicatorStyle">표시</label>
                <select id="indicator-style" name="indicator_style">
                  <option value="ring" data-i18n="option.ring">원</option>
                  <option value="bar" data-i18n="option.bar">바</option>
                </select>
              </div>

              <label class="toggle-row">
                <input type="checkbox" name="fullscreen_hide_on" checked />
                <span data-i18n="field.fullscreenHide">전체화면 앱에서 숨김</span>
              </label>

              <label class="toggle-row">
                <input type="checkbox" name="maximized_hide_on" />
                <span data-i18n="field.maximizedHide">전체창 숨김</span>
              </label>

              <label class="toggle-row">
                <input type="checkbox" name="show_claude" checked />
                <span data-i18n="field.showClaude">Claude 표시</span>
              </label>

              <label class="toggle-row">
                <input type="checkbox" name="show_codex" checked />
                <span data-i18n="field.showCodex">Codex 표시</span>
              </label>
            </div>
          </fieldset>

          <fieldset class="settings-section" data-settings-section="indicator">
            <legend data-i18n="section.indicator">원·바 세부</legend>
            <div class="settings-section-grid">
              <div class="effect-field">
                <span id="effect-style-label" class="effect-label" data-i18n="field.effectStyle">표현 스타일</span>
                <input id="indicator-effect-style" type="hidden" name="indicator_effect_style" value="flat" />
                <div class="effect-picker" role="radiogroup" aria-labelledby="effect-style-label" data-effect-picker>
                  <button type="button" class="effect-option" role="radio" aria-checked="true" data-effect-value="flat">
                    <span class="effect-preview" aria-hidden="true"><i class="effect-preview-ring"></i><i class="effect-preview-bars"></i></span>
                    <span data-i18n="effect.flat">플랫</span>
                  </button>
                  <button type="button" class="effect-option" role="radio" aria-checked="false" data-effect-value="soft">
                    <span class="effect-preview" aria-hidden="true"><i class="effect-preview-ring"></i><i class="effect-preview-bars"></i></span>
                    <span data-i18n="effect.soft">소프트 그림자</span>
                  </button>
                  <button type="button" class="effect-option" role="radio" aria-checked="false" data-effect-value="depth">
                    <span class="effect-preview" aria-hidden="true"><i class="effect-preview-ring"></i><i class="effect-preview-bars"></i></span>
                    <span data-i18n="effect.depth">입체</span>
                  </button>
                  <button type="button" class="effect-option" role="radio" aria-checked="false" data-effect-value="glow">
                    <span class="effect-preview" aria-hidden="true"><i class="effect-preview-ring"></i><i class="effect-preview-bars"></i></span>
                    <span data-i18n="effect.glow">글로우</span>
                  </button>
                  <button type="button" class="effect-option" role="radio" aria-checked="false" data-effect-value="breathe">
                    <span class="effect-preview" aria-hidden="true"><i class="effect-preview-ring"></i><i class="effect-preview-bars"></i></span>
                    <span data-i18n="effect.breathe">숨쉬기</span>
                  </button>
                </div>
              </div>

              <label class="toggle-row">
                <input type="checkbox" name="ring_on" checked />
                <span data-i18n="field.ring">링</span>
              </label>

              <label class="toggle-row">
                <input type="checkbox" name="ring_numbers_on" checked />
                <span data-i18n="field.ringNumbers">링 숫자</span>
              </label>

              <label class="toggle-row">
                <input type="checkbox" name="ring_number_outline_on" checked />
                <span data-i18n="field.numberOutline">숫자 윤곽</span>
              </label>

              <label class="range-row center-size-row">
                <span data-i18n="field.centerSize">중앙 공간 지름</span>
                <span class="range-value-editor">
                  <output name="ring-center-size-output" hidden>16</output>
                  <input type="number" data-range-number-for="ring_center_size_px" min="4" max="32" step="0.1" value="16" />
                  <span class="range-unit">px</span>
                </span>
                <input
                  type="range"
                  name="ring_center_size_px"
                  min="4"
                  max="32"
                  step="0.1"
                  value="16"
                />
              </label>

              <details class="settings-advanced" data-settings-advanced="typography" open>
                <summary data-i18n="advanced.typography">글자 조정</summary>
                <div class="settings-advanced-grid">
                  <label class="range-row">
                    <span data-i18n="field.ringNumberSize">원 안 숫자 크기</span>
                    <span class="range-value-editor">
                      <output name="ring-number-font-size-output" hidden>9</output>
                      <input type="number" data-range-number-for="ring_number_font_size_px" min="6" max="16" step="0.1" value="9" />
                      <span class="range-unit">px</span>
                    </span>
                    <input
                      type="range"
                      name="ring_number_font_size_px"
                      min="6"
                      max="16"
                      step="0.1"
                      value="9"
                    />
                  </label>

                  <label class="range-row">
                    <span data-i18n="field.ringNumberWeight">원 안 숫자 굵기</span>
                    <span class="range-value-editor">
                      <output name="ring-number-font-weight-output" hidden>600</output>
                      <input type="number" data-range-number-for="ring_number_font_weight" min="100" max="900" step="50" value="600" />
                    </span>
                    <input
                      type="range"
                      name="ring_number_font_weight"
                      min="100"
                      max="900"
                      step="50"
                      value="600"
                    />
                  </label>

                  <label class="range-row">
                    <span data-i18n="field.infoTextSize">바깥 정보 글자 크기</span>
                    <span class="range-value-editor">
                      <output name="bar-text-font-size-output" hidden>11</output>
                      <input type="number" data-range-number-for="bar_text_font_size_px" min="8" max="16" step="0.1" value="11" />
                      <span class="range-unit">px</span>
                    </span>
                    <input
                      type="range"
                      name="bar_text_font_size_px"
                      min="8"
                      max="16"
                      step="0.1"
                      value="11"
                    />
                  </label>

                  <label class="range-row">
                    <span data-i18n="field.infoTextWeight">바깥 정보 글자 굵기</span>
                    <span class="range-value-editor">
                      <output name="bar-text-font-weight-output" hidden>500</output>
                      <input type="number" data-range-number-for="bar_text_font_weight" min="100" max="900" step="50" value="500" />
                    </span>
                    <input
                      type="range"
                      name="bar_text_font_weight"
                      min="100"
                      max="900"
                      step="50"
                      value="500"
                    />
                  </label>

                  <label class="range-row">
                    <span data-i18n="field.barContentGap">표시기-정보 간격</span>
                    <span class="range-value-editor">
                      <output name="bar-content-gap-output" hidden>14</output>
                      <input type="number" data-range-number-for="bar_content_gap_px" min="0" max="24" step="0.1" value="14" />
                      <span class="range-unit">px</span>
                    </span>
                    <input
                      type="range"
                      name="bar_content_gap_px"
                      min="0"
                      max="24"
                      step="0.1"
                      value="14"
                    />
                  </label>
                </div>
              </details>

              <details class="settings-advanced" data-settings-advanced="indicator">
                <summary data-i18n="advanced.indicator">고급 조정</summary>
                <div class="settings-advanced-grid">
                  <label class="range-row">
                    <span data-i18n="field.numberOutlineWidth">숫자 윤곽 두께</span>
                    <span class="range-value-editor">
                      <output name="ring-number-outline-width-output" hidden>1.2</output>
                      <input type="number" data-range-number-for="ring_number_outline_width_px" min="0" max="4" step="0.1" value="1.2" />
                      <span class="range-unit">px</span>
                    </span>
                    <input
                      type="range"
                      name="ring_number_outline_width_px"
                      min="0"
                      max="4"
                      step="0.1"
                      value="1.2"
                    />
                  </label>

                  <label class="range-row">
                    <span data-i18n="field.ringSize">원 크기</span>
                    <span class="range-value-editor">
                      <output name="ring-size-output" hidden>36</output>
                      <input type="number" data-range-number-for="ring_size_px" min="20" max="44" step="0.1" value="36" />
                      <span class="range-unit">px</span>
                    </span>
                    <input
                      type="range"
                      name="ring_size_px"
                      min="20"
                      max="44"
                      step="0.1"
                      value="36"
                    />
                  </label>

                  <label class="range-row">
                    <span data-i18n="field.ringThickness">링 두께</span>
                    <span class="range-value-editor">
                      <output name="ring-thickness-output" hidden>4</output>
                      <input type="number" data-range-number-for="ring_thickness_px" min="1" max="10" step="0.1" value="4" />
                      <span class="range-unit">px</span>
                    </span>
                    <input
                      type="range"
                      name="ring_thickness_px"
                      min="1"
                      max="10"
                      step="0.1"
                      value="4"
                    />
                  </label>

                  <label class="range-row">
                    <span data-i18n="field.ringGap">링 간격</span>
                    <span class="range-value-editor">
                      <output name="ring-gap-output" hidden>6</output>
                      <input type="number" data-range-number-for="ring_gap_px" min="2" max="14" step="0.1" value="6" />
                      <span class="range-unit">px</span>
                    </span>
                    <input
                      type="range"
                      name="ring_gap_px"
                      min="2"
                      max="14"
                      step="0.1"
                      value="6"
                    />
                  </label>

                </div>
              </details>
            </div>
          </fieldset>

          <fieldset class="settings-section" data-settings-section="system">
            <legend data-i18n="section.system">시스템</legend>
            <div class="settings-section-grid">
              <label class="toggle-row">
                <input type="checkbox" name="autostart_on" checked />
                <span data-i18n="field.autostart">자동시작</span>
              </label>

              <div class="button-row">
                <button type="button" data-action="restore-statusline" data-i18n="action.restore">복원</button>
              </div>

            </div>
          </fieldset>

          <input type="hidden" name="claude_taskbar_offset_ratio" value="0.5" />
          <input type="hidden" name="codex_taskbar_offset_ratio" value="0.5" />
          </div>
        </details>

        <section class="settings-utility-card update-card" data-settings-section="update">
          <header class="settings-utility-head">
            <h2 data-i18n="section.update">업데이트</h2>
          </header>
          <div class="settings-section-grid update-controls">
              <label class="toggle-row toggle-row-wide">
                <input type="checkbox" name="update_check_on" checked />
                <span class="toggle-copy">
                  <span class="toggle-title" data-i18n="field.updateCheck">업데이트 자동 확인</span>
                  <span class="field-help" data-i18n="help.updateCheck">시작 후 하루에 한 번 최신 정식 릴리즈를 확인합니다.</span>
                </span>
              </label>
              <div class="button-row update-actions">
                <button type="button" data-action="check-updates" data-i18n="action.checkUpdate">업데이트 확인</button>
                <button type="button" data-action="open-releases" data-i18n="action.releasePage">릴리즈 페이지</button>
              </div>
              <p id="update-check-status" class="settings-status update-check-status" aria-live="polite"></p>
          </div>
        </section>
      </form>

      <section class="settings-utility-card about-card" data-settings-section="about">
        <header class="settings-utility-head">
          <h2 data-i18n="section.about">정보</h2>
        </header>
        <div class="about-copy">
          <div class="about-heading">
            <strong>Juice</strong>
            <span><span data-i18n="about.version">버전</span> <b data-app-version>–</b></span>
          </div>
          <p data-i18n="about.description">Claude Code와 Codex의 5시간·주간 사용량을 Windows 작업표시줄에서 확인하는 로컬 모니터입니다.</p>
          <p data-i18n="about.privacy">Juice는 사용량이나 로그인 정보를 별도 Juice 서버에 저장하지 않습니다.</p>
        </div>
      </section>
      </main>
      <div class="settings-toast-layer" data-settings-toast hidden>
        <div class="settings-toast" role="status" aria-live="polite" aria-atomic="true">
          <span class="settings-toast-dot" aria-hidden="true"></span>
          <span data-settings-toast-text></span>
        </div>
      </div>
    </div>
  </body>
</html>
